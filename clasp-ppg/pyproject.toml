[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clasp-ppg"
version = "0.1.0"
description = "Local Polar Verity Sense PPG capture and experimental verification module for Clasp"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "polar-ble-sdk @ git+https://github.com/PhelaPoscam/Polar-Python-SDK.git@1ca19a44096e34c0ad0edef95db63d1ea051ed0f",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
papagei = ["torch>=2.0"]

[project.scripts]
clasp-ppg = "clasp_ppg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
